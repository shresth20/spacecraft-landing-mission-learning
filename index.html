<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spacecraft Mission Learning</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Swiftee's stand-in for the half of its jump that happens behind the
       board: it sits before the stage in the document, so it paints under the
       board, and script.js hands over to the in-board sprite at the top of the
       arc. -->
  <div class="hopper" id="hopper" aria-hidden="true"></div>

  <div class="stage">
  <main class="board" id="board">

    <!-- The instruction is the board's heading, with Swiftee standing to its
         left. It types itself out in step with the voice-over and then stays
         for the rest of the round. -->
    <header class="prompt-row">
      <h1 class="prompt" id="prompt">
        <!-- Swiftee's place for the whole mission: it jumps in here from
             behind the board once the board has appeared, and stands at the
             left end of whatever line the heading shows -->
        <div class="mascot" id="mascot" aria-hidden="true"></div>
        <span class="type-wrap">
          <!-- invisible copy of the longest line the heading will ever show:
               holds one width for the whole level, so neither the text nor
               Swiftee beside it moves as characters are typed in -->
          <span class="type-ghost" id="promptGhost"></span>
          <span class="type" id="promptType" aria-live="polite"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
        </span>
        <!-- Swiftee's reaction to an answer, for the screen reader only: on
             the board the bird and the sound do the acknowledging -->
        <span class="quip" id="quip" aria-live="polite"></span>
      </h1>
    </header>

    <section class="bay" id="bay">
      <!-- Cell 1 -->
      <div class="cell">
        <div class="shape-stage">
          <div class="shape" data-shape="rect" role="img" aria-label="A rectangle">
            <!-- overflow is visible, so the dimension labels sit outside the
                 viewBox without changing the artwork's layout box -->
            <svg viewBox="-40 0 320 170" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
              <defs>
                <clipPath id="wipeRect"><rect class="wipe" x="0" y="0" width="240" height="132" /></clipPath>
              </defs>
              <g class="art">
                <rect class="shape-fill" clip-path="url(#wipeRect)"
                      x="4" y="4" width="232" height="124" />
                <path class="shape-outline" d="M4 4 H236 V128 H4 Z" fill="none" stroke-width="5" />
              </g>
              <!-- shown in round 2, after the first wrong drop -->
              <g class="labels">
                <g class="wdim wdim-h"><line class="wdim-line" x1="4" y1="144" x2="236" y2="144" /><path class="wdim-head" d="M12 139 L4 144 L12 149 M228 139 L236 144 L228 149" /><text class="shape-label" x="120" y="160" font-size="13" text-anchor="middle">length</text></g>
                <g class="wdim wdim-v"><line class="wdim-line" x1="252" y1="4" x2="252" y2="128" /><path class="wdim-head" d="M247 12 L252 4 L257 12 M247 120 L252 128 L257 120" /><text class="shape-label" x="268" y="66" font-size="13" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 268 66)">breadth</text></g>
              </g>
            </svg>
          </div>
        </div>
        <!-- both rounds' slots exist from the first frame so the bay never
             changes height between levels -->
        <div class="dock">
          <div class="slot" data-round="1" data-accept="rect" aria-label="Name of the first shape"></div>
          <div class="slot" data-round="2" data-accept="rect" aria-label="Area of the first shape"></div>
        </div>
      </div>

      <!-- Cell 2 -->
      <div class="cell">
        <div class="shape-stage">
          <div class="shape" data-shape="square" role="img" aria-label="A square">
            <svg viewBox="-40 0 240 200" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
              <defs>
                <clipPath id="wipeSquare"><rect class="wipe" x="0" y="0" width="160" height="160" /></clipPath>
              </defs>
              <g class="art">
                <rect class="shape-fill" clip-path="url(#wipeSquare)"
                      x="4" y="4" width="152" height="152" />
                <path class="shape-outline" d="M4 4 H156 V156 H4 Z" fill="none" stroke-width="5" />
              </g>
              <g class="labels">
                <g class="wdim wdim-h"><line class="wdim-line" x1="4" y1="170" x2="156" y2="170" /><path class="wdim-head" d="M12 165 L4 170 L12 175 M148 165 L156 170 L148 175" /><text class="shape-label" x="80" y="186" font-size="13" text-anchor="middle">side</text></g>
                <g class="wdim wdim-v"><line class="wdim-line" x1="172" y1="4" x2="172" y2="156" /><path class="wdim-head" d="M167 12 L172 4 L177 12 M167 148 L172 156 L177 148" /><text class="shape-label" x="188" y="80" font-size="13" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 188 80)">side</text></g>
              </g>
            </svg>
          </div>
        </div>
        <div class="dock">
          <div class="slot" data-round="1" data-accept="square" aria-label="Name of the second shape"></div>
          <div class="slot" data-round="2" data-accept="square" aria-label="Area of the second shape"></div>
        </div>
      </div>

      <!-- Cell 3 -->
      <div class="cell">
        <div class="shape-stage">
          <div class="shape" data-shape="triangle" role="img" aria-label="A triangle">
            <svg viewBox="-45 0 290 210" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
              <defs>
                <clipPath id="wipeTri"><rect class="wipe" x="0" y="0" width="200" height="172" /></clipPath>
              </defs>
              <g class="art">
                <polygon class="shape-fill" clip-path="url(#wipeTri)"
                         points="100,6 195,166 5,166" />
                <path class="shape-outline" d="M100 6 L195 166 L5 166 Z" fill="none" stroke-width="5" />
              </g>
              <g class="labels">
                <line class="height-line" x1="100" y1="10" x2="100" y2="166" />
                <g class="wdim wdim-h"><line class="wdim-line" x1="5" y1="182" x2="195" y2="182" /><path class="wdim-head" d="M13 177 L5 182 L13 187 M187 177 L195 182 L187 187" /><text class="shape-label" x="100" y="198" font-size="13" text-anchor="middle">base</text></g>
                <g class="wdim wdim-v"><line class="wdim-line" x1="-14" y1="6" x2="-14" y2="166" /><path class="wdim-head" d="M-19 14 L-14 6 L-9 14 M-19 158 L-14 166 L-9 158" /><text class="shape-label" x="-30" y="86" font-size="13" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 -30 86)">height</text></g>
              </g>
            </svg>
          </div>
        </div>
        <div class="dock">
          <div class="slot" data-round="1" data-accept="triangle" aria-label="Name of the third shape"></div>
          <div class="slot" data-round="2" data-accept="triangle" aria-label="Area of the third shape"></div>
        </div>
      </div>
    </section>

    <!-- ---------- section 2: the triangle lesson ----------
         Shares the bay's grid cell and is invisible until the warm-up has
         cleared away. Each triangle is built like the warm-up shapes -- an
         outline path that draws itself, a fill that pours in behind a clip --
         plus a set of dotted dimension lines the script grows into place and
         lights up as the formula names them. One viewBox for all three, so the
         bases sit on one line. -->
    <section class="lesson" id="lesson" aria-hidden="true">
      <div class="tri-row" id="triRow">

        <!-- acute (isosceles): the height stands inside it -->
        <div class="tri-cell">
          <div class="tri" data-tri="acute" role="img" aria-label="An acute triangle">
            <svg viewBox="0 0 240 210" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <defs>
                <clipPath id="wipeTriA"><rect class="wipe" x="0" y="0" width="240" height="210" /></clipPath>
              </defs>
              <g class="art">
                <polygon class="shape-fill" clip-path="url(#wipeTriA)" points="120,16 218,176 22,176" />
                <path class="shape-outline" d="M120 16 L218 176 L22 176 Z" fill="none" stroke-width="5" />
              </g>
              <g class="dims">
                <line class="dim dim-base"   x1="22"  y1="186" x2="218" y2="186" />
                <path class="dim-head head-base" d="M30 181 L22 186 L30 191 M210 181 L218 186 L210 191" />
                <line class="dim dim-height" x1="120" y1="16"  x2="120" y2="176" />
                <path class="dim-head head-height" d="M115 24 L120 16 L125 24 M115 168 L120 176 L125 168" />
                <path class="dim-mark" d="M132 176 V164 H120" />
                <text class="dim-label lbl-base" x="120" y="203" font-size="13" text-anchor="middle">Base</text>
                <text class="dim-label lbl-height" x="133" y="98" font-size="13" text-anchor="middle"
                      dominant-baseline="middle" transform="rotate(-90 133 98)">Height</text>
              </g>
            </svg>
          </div>
        </div>

        <!-- right-angled (scalene): the height is one of its own sides -->
        <div class="tri-cell">
          <div class="tri" data-tri="right" role="img" aria-label="A right-angled scalene triangle">
            <svg viewBox="0 0 240 210" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <defs>
                <clipPath id="wipeTriB"><rect class="wipe" x="0" y="0" width="240" height="210" /></clipPath>
              </defs>
              <g class="art">
                <polygon class="shape-fill" clip-path="url(#wipeTriB)" points="30,26 214,176 30,176" />
                <path class="shape-outline" d="M30 26 L214 176 L30 176 Z" fill="none" stroke-width="5" />
              </g>
              <g class="dims">
                <line class="dim dim-base"   x1="30" y1="186" x2="214" y2="186" />
                <path class="dim-head head-base" d="M38 181 L30 186 L38 191 M206 181 L214 186 L206 191" />
                <line class="dim dim-height" x1="20" y1="26"  x2="20"  y2="176" />
                <path class="dim-head head-height" d="M15 34 L20 26 L25 34 M15 168 L20 176 L25 168" />
                <path class="dim-mark" d="M42 176 V164 H30" />
                <text class="dim-label lbl-base" x="122" y="203" font-size="13" text-anchor="middle">Base</text>
                <text class="dim-label lbl-height" x="9" y="101" font-size="13" text-anchor="middle"
                      dominant-baseline="middle" transform="rotate(-90 9 101)">Height</text>
              </g>
            </svg>
          </div>
        </div>

        <!-- obtuse: the height falls outside it, onto the base extended -->
        <div class="tri-cell">
          <div class="tri" data-tri="obtuse" role="img" aria-label="An obtuse triangle">
            <svg viewBox="0 0 240 210" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
              <defs>
                <clipPath id="wipeTriC"><rect class="wipe" x="0" y="0" width="240" height="210" /></clipPath>
              </defs>
              <g class="art">
                <polygon class="shape-fill" clip-path="url(#wipeTriC)" points="40,22 226,176 118,176" />
                <path class="shape-outline" d="M40 22 L226 176 L118 176 Z" fill="none" stroke-width="5" />
              </g>
              <g class="dims">
                <line class="dim dim-base"   x1="118" y1="186" x2="226" y2="186" />
                <path class="dim-head head-base" d="M126 181 L118 186 L126 191 M218 181 L226 186 L218 191" />
                <!-- the base carried on to meet the height -->
                <line class="dim dim-ext"    x1="118" y1="176" x2="40"  y2="176" />
                <line class="dim dim-height" x1="40"  y1="22"  x2="40"  y2="176" />
                <path class="dim-head head-height" d="M35 30 L40 22 L45 30 M35 168 L40 176 L45 168" />
                <path class="dim-mark" d="M52 176 V164 H40" />
                <text class="dim-label lbl-base" x="172" y="203" font-size="13" text-anchor="middle">Base</text>
                <text class="dim-label lbl-height" x="29" y="100" font-size="13" text-anchor="middle"
                      dominant-baseline="middle" transform="rotate(-90 29 100)">Height</text>
              </g>
            </svg>
          </div>
        </div>
      </div>

      <!-- the area formula, typed out word by word; script.js builds the word
           spans in both the ghost and the live line so the box is sized to the
           whole formula before the first character lands -->
      <div class="formula-box" id="formulaBox" aria-live="polite">
        <span class="type-wrap">
          <span class="type-ghost" id="formulaGhost"></span>
          <span class="type" id="formulaType"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
        </span>
      </div>
    </section>

    <!-- ---------- section 3: the quadrilateral ----------
         Shares the middle cell with the bay and the lesson, and is invisible
         until the lesson has cleared away. One quadrilateral, built like every
         other shape here (an outline that draws itself, a fill that pours in
         behind a clip), plus everything the scene will add to it later: the
         two triangles it splits into, the diagonal the learner draws, the
         dotted heights, and the four corner dots. Under it, three things take
         turns in one grid cell: the name quiz, Swiftee's aside, and the area
         working. -->
    <section class="quad" id="quad" aria-hidden="true">
      <div class="quad-stage">
        <div class="quad-shape" id="quadShape" role="img" aria-label="A quadrilateral">
          <svg class="quad-svg" id="quadSvg" viewBox="0 0 333 272" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <clipPath id="wipeQuad"><rect class="wipe" x="0" y="0" width="333" height="272" /></clipPath>
            </defs>
            <!-- built by script.js from the scene's corners -->
            <g class="art"></g>
            <!-- the learner's diagonal: left corner to right corner -->
            <line class="join-line" id="joinLine" x1="10" y1="151" x2="10" y2="151" />
            <g class="dims"></g>
            <!-- the hint: a dotted line and a finger travelling left to right -->
            <g class="demo" id="demoJoin">
              <line class="demo-line" id="demoLine" x1="10" y1="151" x2="10" y2="151" />
              <g class="demo-hand" id="demoHand">
                <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z" />
              </g>
            </g>
            <!-- the corners; the hit circle is bigger than the dot it serves -->
            <g class="dots" id="dots"></g>
          </svg>
        </div>
      </div>

      <!-- three occupants of one cell, so the shape above never moves -->
      <div class="quad-foot">
        <!-- the name quiz: "This is a [ v ]", Swiftee beside it, its remark under -->
        <div class="quiz-block" id="quizBlock">
          <div class="quiz-row">
            <div class="quiz-sentence">
              <span class="quiz-label">This is a</span>
              <div class="dd" id="dd">
                <button class="dd-btn" id="ddBtn" type="button" aria-haspopup="listbox" aria-expanded="false"
                        aria-label="Choose the name of the shape">
                  <span class="dd-value" id="ddValue"></span>
                  <svg class="dd-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-8 10z" /></svg>
                </button>
                <div class="dd-menu" id="ddMenu" role="listbox">
                  <button class="dd-opt" type="button" role="option" data-value="triangle">Triangle</button>
                  <button class="dd-opt" type="button" role="option" data-value="quadrilateral">Quadrilateral</button>
                  <button class="dd-opt" type="button" role="option" data-value="pentagon">Pentagon</button>
                </div>
              </div>
            </div>
            <div class="mascot" id="quizMascot" aria-hidden="true"></div>
          </div>
          <p class="quiz-note" id="quizNote" aria-live="polite">
            <span class="type-wrap">
              <span class="type-ghost" id="noteGhost"></span>
              <span class="type" id="noteType"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
            </span>
          </p>
        </div>

        <!-- Swiftee's aside, standing to the left of what it says -->
        <div class="say-row" id="sayRow">
          <div class="mascot" id="sideMascot" aria-hidden="true"></div>
          <p class="say-text" id="sayText" aria-live="polite">
            <span class="type-wrap">
              <span class="type-ghost" id="sayGhost"></span>
              <span class="type" id="sayType"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
            </span>
          </p>
        </div>

        <!-- the working, one line at a time; script.js builds each line -->
        <div class="area-lines" id="areaLines" aria-live="polite"></div>
      </div>
    </section>

    <!-- ---------- section 4: the parallelogram ----------
         The first of the special quadrilaterals. Shares the middle cell with
         everything before it, and is invisible until the board comes back
         after Swiftee's aside. The shape itself is built by script.js from
         its four corners, along with everything the explanation draws over
         it: a glowing copy of each side, the dotted lines that carry a pair
         of sides on to show they never meet, the arrow marks that say
         "parallel", the tick marks that say "equal", and the measuring copy
         of a side that travels across to lie over its partner. Under it, two
         things take turns in one cell: the two-chip name quiz, and the list
         of facts Swiftee hops down to state. -->
    <section class="para" id="para" aria-hidden="true">
      <div class="para-stage">
        <div class="para-shape" id="paraShape" role="img" aria-label="A parallelogram">
          <!-- room above and below the shape for the base arrows and their
               labels, so switching them on moves nothing -->
          <svg class="para-svg" id="paraSvg" viewBox="-44 -46 452 300" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <clipPath id="wipePara"><rect class="wipe" x="-44" y="-46" width="452" height="300" /></clipPath>
            </defs>
            <!-- built by script.js from the shape's corners: the fill, the two
                 triangles it will be cut into, and the outline -->
            <g class="art"></g>
            <!-- the base and height, the diagonal, and the second pair -->
            <g class="para-dims" id="paraDims"></g>
            <!-- the opposite-sides explanation -->
            <g class="para-ex" id="paraEx"></g>
          </svg>
        </div>
      </div>

      <!-- two occupants of one cell, so the shape above never moves -->
      <div class="para-foot">
        <!-- the name quiz: two chips, tap the right one -->
        <div class="para-tray" id="paraTray">
          <button class="chip" type="button" data-answer="parallelogram"><span>Parallelogram</span></button>
          <button class="chip" type="button" data-answer="trapezium"><span>Trapezium</span></button>
        </div>

        <!-- the area quiz: three formulas, tap the right one -->
        <div class="para-tray area-tray" id="areaTray">
          <button class="chip formula" type="button" data-answer="half"><span><span class="frac"><span class="num">1</span><span class="den">2</span></span> &times; base &times; height</span></button>
          <button class="chip formula" type="button" data-answer="bh"><span>base &times; height</span></button>
          <button class="chip formula" type="button" data-answer="double"><span>2 &times; base &times; height</span></button>
        </div>

        <!-- the working, beside the shape once it has moved left; script.js
             builds each line -->
        <div class="area-lines" id="paraLines" aria-live="polite"></div>

        <!-- the facts, stated one at a time with Swiftee standing beside them -->
        <div class="facts" id="facts">
          <div class="mascot" id="factMascot" aria-hidden="true"></div>
          <div class="fact-list">
            <p class="fact" id="factA" aria-live="polite">
              <span class="fact-check" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              </span>
              <span class="type-wrap">
                <span class="type-ghost"></span>
                <span class="type"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
              </span>
            </p>
            <p class="fact" id="factB" aria-live="polite">
              <span class="fact-check" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
              </span>
              <span class="type-wrap">
                <span class="type-ghost"></span>
                <span class="type"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
              </span>
            </p>
          </div>
        </div>
      </div>
    </section>

    <!-- ---------- section 5: the rhombus ----------
         The special parallelogram. Shares the middle cell with everything
         before it, and is invisible until the board comes back after
         Swiftee's aside. A second parallelogram, in a colour of its own, is
         built by script.js from its corners and then handed to the learner:
         two of its corners carry points that can be dragged, and every
         frame the shape, its two diagonals and the four angle marks at
         their crossing are redrawn from the two side lengths. The marks are
         arcs until the sides come out equal, when they morph into little
         squares. Under it, one row: Swiftee, hopped down, and the line it
         says about the rhombus. -->
    <section class="rhom" id="rhom" aria-hidden="true">
      <div class="rhom-stage">
        <!-- the practice figures: built by script.js for each question and
             shown in place of the rhombus once it has been worked through -->
        <div class="rhom-practice" id="rhomPractice" aria-live="polite">
          <div class="fig-row" id="figRow"></div>
        </div>
        <div class="rhom-shape" id="rhomShape" role="img" aria-label="A parallelogram that becomes a rhombus">
          <svg class="rhom-svg" id="rhomSvg" viewBox="0 14 440 268" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <clipPath id="wipeRhom"><rect class="wipe" x="0" y="14" width="440" height="268" /></clipPath>
            </defs>
            <!-- built by script.js from the shape's corners: the fill and the
                 outline that draws itself -->
            <g class="art"></g>
            <!-- the two sides the points move, lit while they can be moved -->
            <g class="rhom-live" id="rhomLive"></g>
            <!-- the diagonals, and the four angles at their crossing -->
            <g class="rhom-diag" id="rhomDiag"></g>
            <g class="rhom-marks" id="rhomMarks"></g>
            <!-- the showcase: the glow that runs round the equal sides, and
                 the tick marks it leaves on them -->
            <g class="rhom-ex" id="rhomEx"></g>
            <!-- the area lesson, once the shape has been tilted: the two
                 diagonals with their names, the right angle between them,
                 and the two half-diagonals that are the triangles' heights -->
            <g class="rhom-area" id="rhomArea"></g>
            <!-- the two draggable points -->
            <g class="rhom-handles" id="rhomHandles"></g>
            <!-- the hint: a finger that takes hold of a point and nudges it -->
            <g class="rhom-hint" id="rhomHint">
              <path d="M9 11.24V7.5C9 6.12 10.12 5 11.5 5S14 6.12 14 7.5v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 13.99 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.2 0-.62-.38-1.16-.91-1.38z" />
            </g>
          </svg>
        </div>
      </div>

      <!-- four occupants of one cell, so the shape above never moves:
           Swiftee's line about the rhombus, the two formula quizzes, and the
           working beside the shape once it has moved left -->
      <div class="rhom-foot">
        <div class="rhom-say" id="rhomSay">
          <div class="mascot" id="rhomMascot" aria-hidden="true"></div>
          <p class="say-text" id="rhomText" aria-live="polite">
            <span class="type-wrap">
              <span class="type-ghost"></span>
              <span class="type"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
            </span>
          </p>
        </div>

        <!-- the area of the green (lower) triangle: two formulas, tap the right one -->
        <div class="para-tray rhom-tray" id="rhomTray1">
          <button class="chip formula" type="button" data-answer="half"><span><span class="frac"><span class="num">1</span><span class="den">2</span></span> × d₁ × h₁</span></button>
          <button class="chip formula" type="button" data-answer="double"><span>2 × d₁ × h₁</span></button>
        </div>

        <!-- the area of the purple (upper) triangle -->
        <div class="para-tray rhom-tray" id="rhomTray2">
          <button class="chip formula" type="button" data-answer="plain"><span>d₁ × h₂</span></button>
          <button class="chip formula" type="button" data-answer="half"><span><span class="frac"><span class="num">1</span><span class="den">2</span></span> × d₁ × h₂</span></button>
        </div>

        <!-- the working, beside the shape once it has moved left -->
        <div class="area-lines" id="rhomLines" aria-live="polite"></div>

        <!-- the numbers: the formula with two empty slots, and the lengths
             to drag into them -->
        <div class="rhom-quiz" id="rhomQuiz">
          <div class="area-line len-formula" id="rhomFormula">
            <span class="seg">Area = <span class="frac"><span class="num">1</span><span class="den">2</span></span> ×</span>
            <span class="fslot" data-slot="1" role="button" tabindex="-1" aria-label="First length"></span>
            <span class="seg">×</span>
            <span class="fslot" data-slot="2" role="button" tabindex="-1" aria-label="Second length"></span>
          </div>
          <div class="para-tray len-tray" id="rhomTray3">
            <button class="chip" type="button" data-len="16"><span>16 cm</span></button>
            <button class="chip" type="button" data-len="12"><span>12 cm</span></button>
            <button class="chip" type="button" data-len="28"><span>28 cm</span></button>
            <button class="chip" type="button" data-len="8"><span>8 cm</span></button>
          </div>
        </div>

        <!-- the practice questions' answers: chips built by script.js -->
        <div class="para-tray practice-tray" id="practiceTray"></div>

        <!-- Swiftee hops down here to explain the answer to a question -->
        <div class="practice-say" id="practiceSay">
          <div class="mascot" id="practiceMascot" aria-hidden="true"></div>
          <p class="say-text" id="practiceText" aria-live="polite">
            <span class="type-wrap">
              <span class="type-ghost"></span>
              <span class="type"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
            </span>
          </p>
        </div>
      </div>
    </section>

    <!-- ---------- section 6: the trapezium ----------
         The third special quadrilateral. Shares the middle cell with
         everything before it, and is invisible until the board comes back
         after Swiftee's aside. Level 1: one trapezium, built by script.js
         from its corners, with the pair of "parallel" marks it takes once it
         has been named from the drop-down under it. Level 2: six cards in
         the same cell, built by script.js, three of them trapeziums; the
         learner picks those out, each tap answered at once, then the three
         line up and each takes a slot under it for its name to be dragged
         into. -->
    <section class="trap" id="trap" aria-hidden="true">
      <div class="trap-stage">
        <div class="trap-shape" id="trapShape" role="img" aria-label="A trapezium">
          <svg class="trap-svg" id="trapSvg" viewBox="0 0 420 260" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <clipPath id="wipeTrap"><rect class="wipe" x="0" y="0" width="420" height="260" /></clipPath>
            </defs>
            <!-- built by script.js from the shape's corners: the fill and the
                 outline that draws itself -->
            <g class="art"></g>
            <!-- the marks that say "parallel", on the top and the bottom -->
            <g class="trap-marks" id="trapMarks"></g>
          </svg>
        </div>
        <!-- the cards of level 2, built by script.js -->
        <div class="trap-cards" id="trapCards">
          <div class="card-grid" id="cardGrid" role="group" aria-label="Shapes to choose from"></div>
        </div>
      </div>

      <!-- two occupants of one cell, so the shape above never moves: the
           name quiz of level 1, and the names to drag once the trapeziums
           have lined up -->
      <div class="trap-foot">
        <!-- the name quiz: "This is a [ v ]", Swiftee beside it, its remark
             in a banner under it -->
        <div class="quiz-block" id="trapQuiz">
          <div class="quiz-row">
            <div class="quiz-sentence">
              <span class="quiz-label">This is a</span>
              <div class="dd" id="trapDD">
                <button class="dd-btn" type="button" aria-haspopup="listbox" aria-expanded="false"
                        aria-label="Choose the name of the shape">
                  <span class="dd-value"></span>
                  <svg class="dd-chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-8 10z" /></svg>
                </button>
                <div class="dd-menu" role="listbox">
                  <button class="dd-opt" type="button" role="option" data-value="kite">Kite</button>
                  <button class="dd-opt" type="button" role="option" data-value="parallelogram">Parallelogram</button>
                  <button class="dd-opt" type="button" role="option" data-value="trapezium">Trapezium</button>
                </div>
              </div>
            </div>
            <div class="mascot" id="trapMascot" aria-hidden="true"></div>
          </div>
          <p class="quiz-note trap-note" id="trapNote" aria-live="polite">
            <span class="type-wrap">
              <span class="type-ghost"></span>
              <span class="type"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
            </span>
          </p>
        </div>

        <!-- the three names, dragged onto the three trapeziums -->
        <div class="trap-tray" id="trapTray">
          <button class="chip" type="button" data-kind="iso"><span>Isosceles Trapezium</span></button>
          <button class="chip" type="button" data-kind="right"><span>Right-angled Trapezium</span></button>
          <button class="chip" type="button" data-kind="scalene"><span>Scalene Trapezium</span></button>
        </div>
      </div>
    </section>

    <!-- ---------- section 7: the area of a trapezium ----------
         One continuous derivation, with Swiftee narrating every beat from
         the heading and then from beside the working, played once for each
         kind of trapezium: right-angled, scalene, isosceles. A trapezium
         draws itself in the middle of the board, moves to the left and
         takes its side names (a, b and h); a copy of it lifts off and turns
         half a circle about the middle of its right-hand side to land
         beside it, so the two make one rectangle (right-angled) or one
         parallelogram (the others). The equal sides are shown equal, the
         two top sides become one length a + b, and the whole's area is
         worked out beside the shape; then the copy fades to a dashed
         outline -- the trapezium is exactly half -- and the formula
         follows. Everything in the svg is built by script.js from the
         shape's corners. -->
    <section class="rtrap" id="rtrap" aria-hidden="true">
      <div class="rtrap-stage">
        <div class="rtrap-shape" id="rtrapShape" role="img"
             aria-label="A trapezium, and a copy of it turned around to make a rectangle or a parallelogram with it">
          <svg class="rtrap-svg" id="rtrapSvg" viewBox="-80 -60 680 280" preserveAspectRatio="xMidYMid meet" aria-hidden="true">
            <defs>
              <clipPath id="wipeRtrap"><rect class="wipe" x="-80" y="-60" width="680" height="280" /></clipPath>
            </defs>
            <!-- the whole drawing slides as one: centred while the trapezium
                 is alone, over to the left once the copy joins it -->
            <g class="rt-scene" id="rtScene">
              <!-- the copy, turned about the middle of the right-hand side; it
                   is lifted over the trapezium while it turns and settles
                   under it once it has landed -->
              <g class="rt-copy" id="rtCopy"></g>
              <!-- the trapezium: the fill, the outline that draws itself,
                   and its two right-angle marks -->
              <g class="art" id="rtArt"></g>
              <!-- the side names, each on a two-headed arrow -->
              <g class="rt-dims" id="rtDims"></g>
              <!-- the glowing copies of the two sides being compared -->
              <g class="rt-hl" id="rtHl"></g>
              <!-- the turn: the pivot, the curved arrow round it, and the
                   finger that follows the arrow -->
              <g class="rt-guide" id="rtGuide"></g>
            </g>
          </svg>
        </div>
        <!-- the practice: figures built by script.js for each question,
             shown in place of the derivation's drawing -->
        <div class="rhom-practice rtrap-practice" id="rtrapPractice" aria-live="polite">
          <div class="fig-row" id="rtFigRow"></div>
        </div>
      </div>

      <!-- Swiftee hops down here for the working: its line about what is
           being worked out, and the lines of working under it. The row
           keeps its box from the first frame, so its arrival moves nothing. -->
      <div class="rtrap-foot">
        <div class="rtrap-say" id="rtrapSay">
          <div class="mascot" id="rtrapMascot" aria-hidden="true"></div>
          <div class="rtrap-col">
            <p class="say-text rtrap-text" id="rtrapText" aria-live="polite">
              <span class="type-wrap">
                <span class="type-ghost"></span>
                <span class="type"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
              </span>
            </p>
            <div class="area-lines rtrap-lines" id="rtrapLines" aria-live="polite"></div>
          </div>
        </div>

        <!-- the practice's other occupants of the same cell, one at a time:
             the formula with three empty boxes and the values to drag into
             them; two questions with drop-downs; the answers to a question;
             and the banner Swiftee hops down to for the comparison -->
        <div class="rhom-quiz rtrap-quiz" id="rtrapQuiz">
          <div class="area-line len-formula" id="rtrapFormula">
            <span class="seg">A = <span class="frac"><span class="num">1</span><span class="den">2</span></span> × (</span>
            <span class="fslot" data-accept="a" role="button" tabindex="-1" aria-label="First parallel side"><i class="hint">a</i></span>
            <span class="seg">+</span>
            <span class="fslot" data-accept="b" role="button" tabindex="-1" aria-label="Second parallel side"><i class="hint">b</i></span>
            <span class="seg">) ×</span>
            <span class="fslot" data-accept="h" role="button" tabindex="-1" aria-label="Height"><i class="hint">h</i></span>
          </div>
          <div class="para-tray len-tray" id="rtrapTray">
            <button class="chip" type="button" data-len="8"><span>8 cm</span></button>
            <button class="chip" type="button" data-len="14"><span>14 cm</span></button>
            <button class="chip" type="button" data-len="6"><span>6 cm</span></button>
          </div>
        </div>
        <div class="area-lines rtrap-qs" id="rtrapQs" aria-live="polite"></div>
        <div class="para-tray practice-tray" id="rtrapPTray"></div>
        <div class="practice-say" id="rtrapPSay">
          <div class="mascot" id="rtrapPMascot" aria-hidden="true"></div>
          <p class="say-text" id="rtrapPText" aria-live="polite">
            <span class="type-wrap">
              <span class="type-ghost"></span>
              <span class="type"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
            </span>
          </p>
        </div>
      </div>
    </section>

    <!-- One console band, two decks of cards stacked in it: round 2's deck is
         laid over round 1's, so the band is the same height all level long. -->
    <div class="tray-area" id="trayArea">
      <div class="tray" id="tray" data-round="1">
        <button class="chip" type="button" data-round="1" data-word="rect"><span>Rectangle</span></button>
        <button class="chip" type="button" data-round="1" data-word="triangle"><span>Triangle</span></button>
        <button class="chip" type="button" data-round="1" data-word="square"><span>Square</span></button>
      </div>
      <div class="tray" id="tray2" data-round="2">
        <button class="chip formula" type="button" data-round="2" data-word="rect"><span>Length &times; Breadth</span></button>
        <button class="chip formula" type="button" data-round="2" data-word="triangle"><span><span class="frac"><span class="num">1</span><span class="den">2</span></span> &times; Base &times; Height</span></button>
        <button class="chip formula" type="button" data-round="2" data-word="square"><span>(Side)<sup>2</sup></span></button>
      </div>
    </div>

    <!-- Next: sits in the middle of the footer band once a section is over,
         over the (by then empty) card decks. -->
    <button class="next-btn" id="nextBtn" type="button" hidden>
      <span>Next</span>
      <svg class="next-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>

  </main>
  </div>

  <!-- Swiftee's stand-in for a hop from one spot on the board to another: it
       sits after the stage, so it paints over the board, and script.js hands
       the sprite to it for the length of the arc. -->
  <div class="flyer" id="flyer" aria-hidden="true"></div>

  <!-- Next, for a scene with no board under it (Swiftee's asides between
       sections): fixed to the viewport, centred low, over the intro layer -->
  <div class="free-next" id="freeNext">
    <button class="next-btn" id="nextBtnFree" type="button" hidden>
      <span>Next</span>
      <svg class="next-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg>
    </button>
  </div>

  <!-- ---------- intro ----------
       Between the Start button and the board: Swiftee hops to the middle of
       the landscape and greets the learner from a speech bubble, then jumps
       away off the bottom of the screen before the board arrives. -->
  <div class="intro" id="intro" aria-hidden="true">
    <div class="intro-mascot" id="introMascot"></div>

    <div class="bubble" id="bubble">
      <!-- the two little emphasis strokes either side of the bubble -->
      <svg class="bubble-mark mark-left" viewBox="0 0 40 60" aria-hidden="true">
        <path d="M8 12 L30 24" /><path d="M8 48 L30 36" />
      </svg>
      <span class="type-wrap">
        <span class="type-ghost" id="bubbleGhost"></span>
        <span class="type" id="bubbleType" aria-live="polite"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
      </span>
      <svg class="bubble-mark mark-right" viewBox="0 0 40 60" aria-hidden="true">
        <path d="M32 12 L10 24" /><path d="M32 48 L10 36" />
      </svg>
      <!-- tail: filled first so it covers the bubble's border where it joins,
           then stroked on its two free edges only -->
      <svg class="bubble-tail" viewBox="0 -8 44 42" aria-hidden="true">
        <path class="tail-fill"   d="M4 -8 H42 V0 C36 12 24 22 2 34 C8 24 8 12 4 0 Z" />
        <path class="tail-stroke" d="M42 0 C36 12 24 22 2 34 C8 24 8 12 4 0" />
      </svg>
    </div>
  </div>

  <!-- confetti / particle layer -->
  <div class="fx-layer" id="fx" aria-hidden="true"></div>

  <!-- swallows every pointer event while an intro or a voice-over is running -->
  <div class="input-lock" id="inputLock" aria-hidden="true"></div>

  <!-- The two scene tools, bottom-right. Siblings of the input lock and
       stacked above it, because the lock is what makes every other control
       dead while a scene is playing -- and these are the two that have to stay
       live exactly then. Anchored to the viewport rather than to the board, so
       they keep the same corner during the intro, when there is no board on
       screen yet.
         Back    -- go back to the scene before this one
         Skip    -- take me to the end of this scene
         Replay  -- play this scene again from its first frame -->
  <!-- Jump straight to a section. Bottom-left, opposite the scene tools, and
       stacked above the input lock for the same reason they are: while a scene
       is playing is exactly when it is wanted. Its list is built from the
       mission order in script.js, so it cannot drift out of step with it, and
       it opens upward because the button sits on the floor of the screen. -->
  <div class="jump" id="jump" hidden>
    <button class="jump-btn" id="jumpBtn" type="button"
            aria-haspopup="listbox" aria-expanded="false"
            aria-label="Jump to a section" title="Jump to a section">
      <svg class="jump-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 7h16M4 12h16M4 17h10" />
      </svg>
      <span class="jump-label" id="jumpLabel">Section</span>
      <svg class="jump-caret" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 15l6-6 6 6" />
      </svg>
    </button>
    <div class="jump-menu" id="jumpMenu" role="listbox" aria-label="Sections"></div>
  </div>

  <div class="hud-tools">
    <button class="tool-btn" id="backBtn" type="button" hidden
            aria-label="Back to the previous section" title="Back to the previous section">
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 5l-7 7 7 7" />
        <path d="M10 5l-7 7 7 7" />
      </svg>
      <span>Back</span>
    </button>
    <button class="tool-btn" id="skipBtn" type="button" hidden
            aria-label="Skip this section" title="Skip this section">
      <span>Skip</span>
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 5l7 7-7 7" />
        <path d="M14 5l7 7-7 7" />
      </svg>
    </button>
    <button class="tool-btn" id="resetBtn" type="button" hidden
            aria-label="Replay this section" title="Replay this section">
      <svg class="tool-icon" viewBox="0 0 24 24" aria-hidden="true">
        <polyline points="2 4 2 10 8 10" />
        <path d="M4.6 15a8.5 8.5 0 1 0 2-8.8L2 10" />
      </svg>
      <span>Replay</span>
    </button>
  </div>

  <!-- only shown if the browser refuses to auto-play the briefing audio -->
  <div class="tap-start" id="tapStart" hidden>
    <button class="tap-start-btn" type="button">Tap to begin</button>
  </div>

  <!-- ---------- welcome screen ----------
       Sits over everything until the learner launches the mission. It doubles
       as the gesture the browser wants before it will play the voice-overs,
       and as the cover for the preload, so the first briefing never stalls. -->
  <div class="welcome" id="welcome">
    <div class="welcome-art" aria-hidden="true"></div>
    <div class="welcome-scrim" aria-hidden="true"></div>
    <div class="welcome-mascot" id="welcomeMascot" aria-hidden="true"></div>

    <div class="welcome-body">
      <h2 class="welcome-title">Spacecraft Mission Learning</h2>

      <div class="welcome-slot">
        <div class="loader" id="loader">
          <p class="loader-label">Preparing mission<span class="dots" aria-hidden="true"><i>.</i><i>.</i><i>.</i></span></p>
          <div class="loader-track" id="loadTrack" role="progressbar"
               aria-label="Loading mission" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="loader-fill" id="loadFill"></div>
          </div>
          <p class="loader-pct" id="loadPct">0%</p>
        </div>

        <button class="start-btn" id="startBtn" type="button" hidden>
          <span>Start</span>
        </button>
      </div>
    </div>
  </div>

  <script src="swiftee-sheets.js"></script>
  <script src="script.js"></script>
</body>
</html>
