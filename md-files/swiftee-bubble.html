<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Swiftee speech bubble</title>
<!--
  ==========================================================================
  Swiftee speech bubble -- single-file version.
  Lifted verbatim from the Area of Quadrilaterals game (style.css + script.js).

  To use in another game, copy three blocks out of this file:
    1. the <style>  block          -> into your stylesheet (or keep inline)
    2. the <div class="intro">     -> paste inside your <body>
    3. the <script> block          -> load after the markup
  Then:
    await SwifteeBubble.say('Hey there');
    await SwifteeBubble.say('Let’s do a quick warm-up!');
    await SwifteeBubble.hide();
  ==========================================================================
-->

<!-- Baloo 2: the rounded display sans the artwork is lettered in. Loaded from
     Google Fonts so this file has no local asset; the @font-face below picks
     up the game's own copy first when assets/fonts/baloo_2/ is present. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&display=swap">

<style>
/* ---------- typeface ---------- */
@font-face {
  font-family: "Baloo 2";
  src: url("assets/fonts/baloo_2/baloo2-variablefont_wght.ttf") format("truetype-variations"),
       url("assets/fonts/baloo_2/baloo2-variablefont_wght.ttf") format("truetype");
  font-weight: 400 800;
  font-style: normal;
  font-display: swap;
}

/* ---------- palette tokens the bubble uses ----------
 * Only these seven; if the host game already defines them, delete this block. */
:root {
  --board-bg: #FBE8EA;          /* bubble fill                         */
  --board-border: #EA979E;      /* 4px border, tail stroke, side marks */
  --heading: #85345E;           /* the text                            */
  --bubble-sheen: #FFFFFF;      /* the catch-light in the corner       */
  --glow-board-soft: rgba(234, 151, 158, .26);   /* --board-border */
  --glow-board-dim:  rgba(234, 151, 158, .13);   /* --board-border */
  --shadow-soft:     rgba(98, 31, 55, .16);      /* --rock-dark    */
}

/* ---------- the layer the bubble lives on ----------
 * Fixed to the viewport, over everything, pointer-transparent. Toggle .on. */
.intro {
  position: fixed;
  inset: 0;
  z-index: 950;
  display: none;
  pointer-events: none;
  font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
}
.intro.on { display: block; }

/* ---------- speech bubble ---------- */
.bubble {
  position: absolute;
  left: 50.5%;
  bottom: 57.5vh;
  /* wide enough for either line to stay on one row; the script slides the box
     left when the screen runs out before the line does. The subtraction is the
     screen margin plus the emphasis strokes either side. */
  max-width: min(1000px, calc(100vw - 24px - 2.2em));
  padding: .62em 1em;
  border: 4px solid var(--board-border);
  border-radius: .62em;
  background: var(--board-bg);
  box-shadow:
    0 0 14px 2px var(--glow-board-soft),
    0 0 34px 10px var(--glow-board-dim),
    0 10px 26px var(--shadow-soft);
  color: var(--heading);
  font-weight: 700;
  /* keyed to the height like the rest of the type, but reined in by the width
     so a portrait phone does not get a bubble wider than the screen */
  font-size: clamp(24.2px, min(6.6vh, 5.1vw), 63.8px);
  line-height: 1.2;
  letter-spacing: .2px;
  text-align: center;

  /* pops out of its own tail, overshoots, settles */
  opacity: 0;
  transform: scale(.15);
  transform-origin: 12% 100%;
  transition: transform .44s cubic-bezier(.2, .9, .3, 1.45), opacity .2s ease;
}
.bubble.show { opacity: 1; transform: none; }
.bubble.out  { transition: transform .26s ease-in, opacity .22s ease .04s; }

/* the catch-light in the top-left corner */
.bubble::before {
  content: "";
  position: absolute;
  left: .42em;
  top: .34em;
  width: .5em;
  height: .2em;
  border-radius: 999px;
  background: var(--bubble-sheen);
  transform: rotate(-22deg);
  opacity: .95;
}

/* ---------- the text: ghost + live copy ----------
 * The hidden ghost reserves the final width, the live span sits on top of
 * it, so words land in place instead of shoving the centred line sideways. */
.type-wrap  { margin-left: 10px; position: relative; display: inline-block; }
.type-ghost { visibility: hidden; }
.type {
  position: absolute;
  inset: 0;
  text-align: left;
  white-space: pre-wrap;
}
.bubble .type-wrap { display: inline-block; vertical-align: top; white-space: normal; max-width: 100%; }
.bubble .type-wrap .type-ghost,
.bubble .type-wrap .type { white-space: pre-wrap; }
.bubble .caret { background: var(--heading); }

/* the words ease in: each fades up and sharpens where it already sits */
.wd { opacity: 0; }
.wd.in { animation: wd-in .46s cubic-bezier(.2, .7, .3, 1) both; }
@keyframes wd-in {
  from { opacity: 0; filter: blur(4px); }
  to   { opacity: 1; filter: blur(0); }
}

/* the typewriter's caret -- kept in the markup, never shown */
.caret {
  display: none;
  width: 2px;
  height: .92em;
  margin-left: 2px;
  vertical-align: -.12em;
  background: var(--heading);
  animation: blink .75s steps(1, end) infinite;
}
.caret[hidden] { display: none; }
@keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

/* ---------- two short strokes each side, converging on the bubble ---------- */
.bubble-mark {
  position: absolute;
  top: 50%;
  width: .62em;
  height: .93em;
  transform: translateY(-50%);
  fill: none;
  stroke: var(--board-border);
  stroke-width: 7;
  stroke-linecap: round;
  overflow: visible;
}
.mark-left  { right: calc(100% + .42em); }
.mark-right { left:  calc(100% + .42em); }

/* ---------- the tail hangs off the bottom-left corner ---------- */
.bubble-tail {
  position: absolute;
  left: .78em;
  top: calc(100% - 4px);        /* starts inside the border so it can cover it */
  width: .76em;
  height: auto;
  overflow: visible;
}
.tail-fill   { fill: var(--board-bg); }
.tail-stroke {
  fill: none;
  stroke: var(--board-border);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-linejoin: round;
  /* the svg is .76em wide for a 44-unit viewBox: keep the stroke the border's
     4px on screen regardless of the scale */
  vector-effect: non-scaling-stroke;
}

/* ---------- the "aside" placement (bird on the left, bubble beside it) ---------- */
.intro.aside .bubble {
  left: 26.5%;
  max-width: min(900px, 64vw);
}
.intro.aside .bubble .type { text-align: center; white-space: pre-wrap; }

@media (prefers-reduced-motion: reduce) {
  .wd.in { animation-duration: .08s; }
  .caret { animation: none; }
  .bubble { transition: opacity .2s ease; }
}

/* ---------- demo chrome only: not part of the bubble ---------- */
html, body { margin: 0; height: 100%; }
body {
  background: linear-gradient(#2b2a6e 0%, #6b3a8e 35%, #e2586a 62%, #b93a4a 85%, #7a2534 100%);
  font-family: "Baloo 2", system-ui, sans-serif;
}
.demo-ctl { position: fixed; left: 12px; bottom: 12px; z-index: 999; display: flex; gap: 8px; }
.demo-ctl button { font: inherit; padding: .5em 1em; border-radius: 8px; border: 0; cursor: pointer; }
</style>
</head>
<body>

<!-- ==================== the bubble markup: paste inside <body> ====================
     The .intro layer is the fixed, full-screen stage the bubble floats on; put
     your own mascot element inside it if you want one. -->
<div class="intro" id="intro" aria-hidden="true">
  <div class="bubble" id="bubble">
    <!-- the two little emphasis strokes either side of the bubble -->
    <svg class="bubble-mark mark-left" viewBox="0 0 40 60" aria-hidden="true">
      <path d="M8 12 L30 24" /><path d="M8 48 L30 36" />
    </svg>
    <span class="type-wrap">
      <span class="type-ghost" id="bubbleGhost"></span>
      <span class="type" id="bubbleType" aria-live="polite"><span class="txt"></span><i class="caret" aria-hidden="true"></i></span>
    </span>
    <svg class="bubble-mark mark-right" viewBox="0 0 40 60" aria-hidden="true">
      <path d="M32 12 L10 24" /><path d="M32 48 L10 36" />
    </svg>
    <!-- tail: filled first so it covers the bubble's border where it joins,
         then stroked on its two free edges only -->
    <svg class="bubble-tail" viewBox="0 -8 44 42" aria-hidden="true">
      <path class="tail-fill"   d="M4 -8 H42 V0 C36 12 24 22 2 34 C8 24 8 12 4 0 Z" />
      <path class="tail-stroke" d="M42 0 C36 12 24 22 2 34 C8 24 8 12 4 0" />
    </svg>
  </div>
</div>
<!-- ==================== /bubble markup ==================== -->

<!-- demo controls only -->
<div class="demo-ctl">
  <button id="demoPlay" type="button">Play greeting</button>
  <button id="demoHide" type="button">Hide</button>
</div>

<script>
/* ==========================================================================
 * Swiftee speech bubble -- the say() routine and its helpers.
 *
 *   SwifteeBubble.say('Hey there');                        // pop in (first call) + word-by-word
 *   await SwifteeBubble.say('Let’s do a quick warm-up!');  // box glides to the new size
 *   await SwifteeBubble.hide();                            // pops away; layer stays on
 *   SwifteeBubble.hide({ layer: true });                   // ...and the .intro layer goes too
 *   SwifteeBubble.aside(true);                             // bird-on-the-left placement
 *
 * Options (all optional): SwifteeBubble.configure({ typeMs: 72, onPop: fn })
 *   typeMs -- ms per character; a line takes text.length * typeMs to arrive
 *   onPop  -- called the moment the bubble pops in (the source game plays a click)
 * ========================================================================== */
(function () {
  'use strict';

  const REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(resolve => setTimeout(resolve, ms));

  const intro       = document.getElementById('intro');
  const bubble      = document.getElementById('bubble');
  const bubbleGhost = document.getElementById('bubbleGhost');
  const bubbleType  = document.getElementById('bubbleType');
  const bubbleTxt   = bubbleType.querySelector('.txt');
  const bubbleCaret = bubbleType.querySelector('.caret');

  let TYPE_MS = 72;                 /* per character, no voice-over to pace against */
  let onPop   = null;
  const WORD_IN_MS = 200;           /* the tail of a line: its last word finishing */

  /* ---------- the half ----------
   * Every "½" is drawn as a stacked fraction, a 1 over a bar over a 2. Text
   * that may carry one goes through setTxt(), which falls back to plain text.
   * (Needs the .frac/.num/.den rules if you use it; otherwise harmless.) */
  const FRAC_HALF = '<span class="frac"><span class="num">1</span><span class="den">2</span></span>';
  const escHTML = str => str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const fracHTML = str => escHTML(str).split('½').join(FRAC_HALF);
  function setTxt(el, text) {
    if (text.indexOf('½') < 0) el.textContent = text;
    else el.innerHTML = fracHTML(text);
  }

  /* ---------- word by word ----------
   * The places a text is cut: after each word together with the spaces that
   * follow it. Pacing stays per character, so a long word takes longer. */
  function wordCuts(text) {
    const cuts = [];
    const re = /\S+\s*/g;
    let m;
    while ((m = re.exec(text)) !== null) cuts.push(m.index + m[0].length);
    if (!cuts.length || cuts[cuts.length - 1] !== text.length) cuts.push(text.length);
    return cuts;
  }

  /* A line laid out whole, a span per word, each hidden until revealed. */
  function wordSpans(root, text) {
    root.textContent = '';
    const words = [];
    let from = 0;
    wordCuts(text).forEach(cut => {
      const sp = document.createElement('span');
      sp.className = 'wd';
      const piece = text.slice(from, cut);
      sp.dataset.t = piece;
      setTxt(sp, piece);
      root.appendChild(sp);
      words.push({ el: sp, cut: cut });
      from = cut;
    });
    return words;
  }

  /* show the words from `due`, each when its first character would have
     been typed. Resolves to the time the line is complete. */
  async function revealWords(words, due, perChar) {
    let from = 0;
    for (const w of words) {
      const left = due + from * perChar - performance.now();
      if (left > 0) await wait(left);
      w.el.classList.add('in');
      from = w.cut;
    }
    return due + from * perChar;
  }
  const wordsSettle = () => wait(REDUCED ? 0 : WORD_IN_MS);

  /* ---------- typewriter ----------
   * Paced against a wall clock rather than a chain of timeouts, so a slow
   * frame costs nothing: the line always lands on time. */
  async function typeInto(txt, blink, text, totalMs) {
    blink.hidden = true;
    const words = wordSpans(txt, text);
    const end = await revealWords(words, performance.now(), totalMs / Math.max(1, text.length));
    const left = end - performance.now();
    if (left > 0) await wait(left);
    await wordsSettle();
  }

  /* Type one line into the bubble. The bubble is sized to the whole line
     before the first character lands (the ghost holds the width), and when a
     line replaces a longer or shorter one the box glides between the two
     widths rather than snapping. */
  async function say(text) {
    if (!intro.classList.contains('on')) intro.classList.add('on');
    bubble.classList.remove('out');
    bubbleTxt.textContent = '';
    bubbleCaret.hidden = true;

    const shown = bubble.classList.contains('show');
    const r0 = bubble.getBoundingClientRect();
    bubble.style.width = '';
    bubble.style.height = '';
    bubble.style.left = '';
    wordSpans(bubbleGhost, text);

    /* before its pop-in the box sits scaled down to a dot, so it is measured
       with the scale lifted for the instant of the measurement */
    const measure = () => {
      if (shown) return bubble.getBoundingClientRect();
      bubble.style.transition = 'none';
      bubble.style.transform = 'none';
      const r = bubble.getBoundingClientRect();
      bubble.style.transform = '';
      void bubble.offsetWidth;
      bubble.style.transition = '';
      return r;
    };
    let r1 = measure();

    /* A long line on a narrow screen: slide the box left rather than let it
       run off the edge -- keeping room for the emphasis strokes outside it.
       The box is only as wide as the room to the right of its left edge, so
       sliding it can let it grow; a second pass settles it. */
    const vw = window.innerWidth;
    const edge = 12 + parseFloat(getComputedStyle(bubble).fontSize) * 1.1;
    for (let pass = 0; pass < 2 && r1.right > vw - edge; pass++) {
      bubble.style.left = Math.max(edge, vw - edge - r1.width) + 'px';
      r1 = measure();
    }

    /* the box is only measured true once it is shown (before that it is
       scaled down to its pop-in size), so a resize is only ever a second line */
    if (shown && !REDUCED && (Math.abs(r1.width - r0.width) > 1 || Math.abs(r1.height - r0.height) > 1)) {
      bubble.style.width  = r0.width + 'px';
      bubble.style.height = r0.height + 'px';
      void bubble.offsetWidth;
      bubble.style.transition = 'width .36s cubic-bezier(.2, .9, .3, 1.2), height .36s cubic-bezier(.2, .9, .3, 1.2)';
      bubble.style.width  = r1.width + 'px';
      bubble.style.height = r1.height + 'px';
      await wait(380);
      bubble.style.transition = '';
      bubble.style.width = '';
      bubble.style.height = '';
    }

    if (!bubble.classList.contains('show')) {
      bubble.classList.add('show');
      if (onPop) onPop();
      await wait(REDUCED ? 200 : 460);
    }

    await typeInto(bubbleTxt, bubbleCaret, text, text.length * TYPE_MS);
  }

  /* the bubble pops away (the source game does this right before the bird
     drops off the bottom of the screen) */
  async function hide(opts) {
    bubble.classList.add('out');
    bubble.classList.remove('show');
    await wait(REDUCED ? 200 : 300);
    if (opts && opts.layer) intro.classList.remove('on', 'aside');
  }

  /* back to a blank, un-popped bubble ready for the next say() */
  function reset() {
    bubble.classList.remove('out', 'show');
    bubble.style.width = bubble.style.height = bubble.style.left = bubble.style.transition = '';
    bubbleTxt.textContent = '';
    bubbleGhost.textContent = '';
  }

  const aside = on => intro.classList.toggle('aside', !!on);
  function configure(o) {
    if (o && typeof o.typeMs === 'number') TYPE_MS = o.typeMs;
    if (o && typeof o.onPop === 'function') onPop = o.onPop;
  }

  window.SwifteeBubble = { say, hide, reset, aside, configure, setTxt, wordSpans, typeInto };
})();

/* ---------- demo only: plays the game's greeting; delete in the host game ---------- */
(function () {
  const GREETING = ['Hey there', 'Let’s do a quick warm-up!'];
  async function play() {
    SwifteeBubble.reset();
    for (const line of GREETING) {
      await SwifteeBubble.say(line);
      await new Promise(r => setTimeout(r, 700));
    }
  }
  document.getElementById('demoPlay').onclick = play;
  document.getElementById('demoHide').onclick = () => SwifteeBubble.hide();
  play();
})();
</script>
</body>
</html>
